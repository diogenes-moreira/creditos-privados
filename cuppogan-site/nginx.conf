server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Cloud Run terminates TLS; the apex goes to www, the canonical host.
    if ($host = "cuppogan.com") {
        return 301 https://www.cuppogan.com$request_uri;
    }

    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Astro builds /terminos as terminos.html; serve it without the extension
    # and send the .html form to the clean URL.
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
