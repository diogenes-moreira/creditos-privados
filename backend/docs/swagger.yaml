host: localhost:8080
info:
  contact:
    email: soporte@cuppogan.com.co
    name: API Support
  description: Microcredit management system API for Argentina
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: CuppoGan API
  version: "1.0"
paths:
  /admin/audit:
    get:
      description: Returns a paginated list of audit log entries recording all system
        operations
      parameters:
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      - default: 50
        description: Pagination limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get audit logs
      tags:
      - Audit
  /admin/clients:
    get:
      description: Returns a paginated list of clients, optionally filtered by a search
        query
      parameters:
      - description: Search query (name, DNI, CUIT)
        in: query
        name: q
        type: string
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List or search clients
      tags:
      - Admin Clients
    post:
      consumes:
      - application/json
      description: Admin creates a client account with all personal data
      parameters:
      - description: Client registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a new client
      tags:
      - Admin Clients
  /admin/clients/{id}:
    get:
      description: Returns the details of a specific client by their UUID
      parameters:
      - description: Client UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a client by ID
      tags:
      - Admin Clients
    put:
      consumes:
      - application/json
      description: Admin updates any client field (name, DNI, CUIT, phone, address,
        etc.)
      parameters:
      - description: Client UUID
        in: path
        name: id
        required: true
        type: string
      - description: Client data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AdminUpdateClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update all client data
      tags:
      - Admin Clients
  /admin/clients/{id}/account:
    get:
      parameters:
      - description: Client UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AccountResponse'
      security:
      - BearerAuth: []
      summary: Get account for a client
      tags:
      - Admin Clients
  /admin/clients/{id}/account/movements:
    get:
      parameters:
      - description: Client UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: Get account movements for a client
      tags:
      - Admin Clients
  /admin/clients/{id}/block:
    post:
      description: Blocks a client account, preventing them from performing operations
      parameters:
      - description: Client UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Block a client
      tags:
      - Admin Clients
  /admin/clients/{id}/comments:
    put:
      consumes:
      - application/json
      parameters:
      - description: Client UUID
        in: path
        name: id
        required: true
        type: string
      - description: Comments
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCommentsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ClientResponse'
        "400":
