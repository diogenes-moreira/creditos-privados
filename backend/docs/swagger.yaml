      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CreditLineResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Get credit lines for a client
      tags:
      - Admin Clients
  /admin/clients/{id}/iva-rate:
    put:
      consumes:
      - application/json
      parameters:
      - description: Client UUID
        in: path
        name: id
        required: true
        type: string
      - description: IVA rate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateIVARateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update IVA rate for a client
      tags:
      - Admin Clients
  /admin/clients/{id}/loans:
    get:
      parameters:
      - description: Client UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: Get loans for a client
      tags:
      - Admin Clients
  /admin/clients/{id}/payments:
    get:
      parameters:
